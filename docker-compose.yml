services:
  io-cloud-ai-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dual_tactics_cloud_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - MODEL_DEVICE=cpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./backend/data:/app/data
